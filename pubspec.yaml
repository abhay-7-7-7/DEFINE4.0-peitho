name: boldkit_flutter
description: BoldKit — Neubrutalism UI Library ported to Flutter. Design system by Aniruddha Agarwal (MIT).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Navigation
  go_router: ^13.2.0
  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  # Fonts
  google_fonts: ^6.2.1
  # Charts
  fl_chart: ^0.68.0
  # Persistence
  shared_preferences: ^2.3.1
  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.2.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
